<!DOCTYPE html>

<style>* {margin: 0; padding: 0; box-sizing: border-box;} body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #f0f8ff 0%, #ffffff 100%); color: #333; overflow-x: hidden; padding: 4rem 2rem;} .main-content {max-width: 1200px; margin: 0 auto;} h1 {color: #2C3E50; font-size: 2.5rem; margin-bottom: 3rem; text-align: center; font-weight: 300; letter-spacing: 0.3rem;} .gallery {display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-bottom: 3rem;} .gallery-item {background: white; border: 2px solid #5B9BD5; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(91, 155, 213, 0.15); transition: all 0.3s;} .gallery-item:hover {transform: translateY(-10px); box-shadow: 0 15px 40px rgba(91, 155, 213, 0.3);} .gallery-item img {width: 100%; height: 250px; object-fit: cover; cursor: pointer;} .gallery-item p {padding: 1rem; text-align: center; color: #666;} .back-btn {display: inline-block; padding: 1rem 2rem; background: white; border: 2px solid #5B9BD5; color: #4A90E2; text-decoration: none; border-radius: 50px; transition: all 0.3s;} .back-btn:hover {background: #4A90E2; color: white;} @media (max-width: 768px) {.gallery {grid-template-columns: 1fr;}}</style>
</head>
