<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sub</title>
<style>* {margin: 0; padding: 0; box-sizing: border-box;} body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%); color: #ddd; overflow-x: hidden;} .cover {width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-size: cover; background-position: center; position: relative;} .cover::before {content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 1;} .cover-content {position: relative; z-index: 2; text-align: center; color: white;} .cover h1 {font-size: 3.5rem; font-weight: 400; letter-spacing: 0.5rem; margin-bottom: 2rem; color: #DC143C; text-shadow: 0 0 20px rgba(220, 20, 60, 0.8); animation: pulseRed 3s ease-in-out infinite;} .cover-btn {padding: 1rem 3rem; background: rgba(139, 0, 0, 0.3); border: 2px solid #8B0000; color: white; font-size: 1.2rem; cursor: pointer; transition: all 0.3s; border-radius: 5px; backdrop-filter: blur(10px);} .cover-btn:hover {background: #8B0000; box-shadow: 0 0 30px rgba(139, 0, 0, 0.8);} .main-content {max-width: 1000px; margin: 0 auto; padding: 4rem 2rem;} .notice-card {background: rgba(30, 30, 30, 0.9); border: 2px solid #8B0000; border-radius: 10px; padding: 3rem; margin-bottom: 3rem; box-shadow: 0 10px 40px rgba(139, 0, 0, 0.4); animation: fadeIn 1s ease;} .notice-card h2 {color: #DC143C; font-size: 2rem; margin-bottom: 2rem; text-align: center; font-weight: 400; letter-spacing: 0.3rem; text-shadow: 0 0 10px rgba(220, 20, 60, 0.5);} .notice-card p {line-height: 2; margin-bottom: 1.5rem; font-size: 1.1rem; color: #ccc;} .notice-card ul {margin-left: 2rem; line-height: 2;} .notice-card li {margin-bottom: 1rem; color: #bbb;} .link-section {display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 3rem;} .link-btn {background: rgba(30, 30, 30, 0.8); border: 2px solid #8B0000; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.3s; border-radius: 10px; text-decoration: none; color: white;} .link-btn:hover {background: rgba(139, 0, 0, 0.3); border-color: #DC143C; box-shadow: 0 0 30px rgba(220, 20, 60, 0.5); transform: translateY(-5px);} .link-btn h3 {font-size: 1.5rem; font-weight: 400; letter-spacing: 0.2rem; color: #DC143C;} .back-btn {display: inline-block; margin-top: 3rem; padding: 1rem 2rem; background: rgba(30, 30, 30, 0.8); border: 2px solid #8B0000; color: white; text-decoration: none; border-radius: 5px; transition: all 0.3s;} .back-btn:hover {background: #8B0000; box-shadow: 0 0 20px rgba(139, 0, 0, 0.6);} @keyframes fadeIn {from {opacity: 0; transform: translateY(20px);} to {opacity: 1; transform: translateY(0);}} @keyframes pulseRed {0%, 100% {text-shadow: 0 0 20px rgba(220, 20, 60, 0.8);} 50% {text-shadow: 0 0 40px rgba(220, 20, 60, 1);}} @media (max-width: 768px) {.cover h1 {font-size: 2rem;} .link-section {grid-template-columns: 1fr;}}</style>
</head>
<body><div class="cover" style="background-image: url('sub-cover.jpg');"><div class="cover-content"><h1><!-- 文案 --></h1><button class="cover-btn" onclick="document.querySelector('.main-content').scrollIntoView({behavior: 'smooth'})">进入</button></div></div><div class="main-content"><div class="notice-card"><h2>须知</h2><p><!-- 须知内容 --></p><ul><li><!-- 条款1 --></li><li><!-- 条款2 --></li><li><!-- 条款3 --></li></ul></div><div class="link-section"><a href="<!-- 小作文链接 -->" class="link-btn"><h3>小作文</h3></a><a href="<!-- 板评链接 -->" class="link-btn"><h3>板评</h3></a></div><a href="index.html" class="back-btn">← 返回主页</a></div><audio autoplay loop><source src="sub-bgm.mp3" type="audio/mpeg"></audio><script>let musicPlayed = false; document.addEventListener('click', function() {if (!musicPlayed) {document.querySelector('audio').play(); musicPlayed = true;}});</script></body></html>
