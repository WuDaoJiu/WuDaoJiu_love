<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>会玩的游戏</title>
<style>* {margin: 0; padding: 0; box-sizing: border-box;} body {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #f0f8ff 0%, #ffffff 100%); color: #333; overflow-x: hidden;} .cover {width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-size: cover; background-position: center; position: relative;} .cover::before {content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: 1;} .cover-content {position: relative; z-index: 2; text-align: center; color: white;} .cover h1 {font-size: 3.5rem; font-weight: 300; letter-spacing: 0.5rem; margin-bottom: 2rem; animation: fadeInUp 1.5s ease;} .cover-btn {padding: 1rem 3rem; background: rgba(255, 255, 255, 0.2); border: 2px solid white; color: white; font-size: 1.2rem; cursor: pointer; transition: all 0.3s; border-radius: 50px; backdrop-filter: blur(10px); animation: fadeInUp 2s ease;} .cover-btn:hover {background: white; color: #4A90E2;} .main-content {max-width: 1000px; margin: 0 auto; padding: 4rem 2rem;} .notice-card {background: rgba(255, 255, 255, 0.9); border: 2px solid #5B9BD5; border-radius: 20px; padding: 3rem; margin-bottom: 3rem; box-shadow: 0 10px 40px rgba(91, 155, 213, 0.2); animation: fadeIn 1s ease;} .notice-card h2 {color: #2C3E50; font-size: 2rem; margin-bottom: 2rem; text-align: center; font-weight: 300; letter-spacing: 0.3rem;} .notice-card p {line-height: 2; margin-bottom: 1.5rem; font-size: 1.1rem;} .notice-card ul {margin-left: 2rem; line-height: 2;} .notice-card li {margin-bottom: 1rem;} .link-section {display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 3rem;} .link-btn {background: white; border: 2px solid #5B9BD5; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.3s; border-radius: 15px; text-decoration: none; color: #2C3E50; box-shadow: 0 5px 20px rgba(91, 155, 213, 0.15);} .link-btn:hover {transform: translateY(-10px); box-shadow: 0 15px 40px rgba(91, 155, 213, 0.3); border-color: #4A90E2;} .link-btn h3 {font-size: 1.5rem; font-weight: 400; letter-spacing: 0.2rem; color: #4A90E2;} .back-btn {display: inline-block; margin-top: 3rem; padding: 1rem 2rem; background: white; border: 2px solid #5B9BD5; color: #4A90E2; text-decoration: none; border-radius: 50px; transition: all 0.3s;} .back-btn:hover {background: #4A90E2; color: white;} @keyframes fadeIn {from {opacity: 0;} to {opacity: 1;}} @keyframes fadeInUp {from {opacity: 0; transform: translateY(30px);} to {opacity: 1; transform: translateY(0);}} @media (max-width: 768px) {.cover h1 {font-size: 2rem;} .link-section {grid-template-columns: 1fr;}}</style>
</head>
<body><div class="cover" style="background-image: url('youxi-cover.jpg');"><div class="cover-content"><h1><!-- 文案 --></h1><button class="cover-btn" onclick="document.querySelector('.main-content').scrollIntoView({behavior: 'smooth'})">进入</button></div></div><div class="main-content"><div class="notice-card"><h2>会玩的游戏</h2><p><!-- 须知内容 --></p><ul><li><!-- 游戏1 --></li><li><!-- 游戏2 --></li><li><!-- 游戏3 --></li></ul></div><div class="link-section"><a href="<!-- 小作文链接 -->" class="link-btn"><h3>小作文</h3></a><a href="<!-- 板评链接 -->" class="link-btn"><h3>板评</h3></a></div><a href="index.html" class="back-btn">← 返回主页</a></div><audio autoplay loop><source src="youxi-bgm.mp3" type="audio/mpeg"></audio><script>let musicPlayed = false; document.addEventListener('click', function() {if (!musicPlayed) {document.querySelector('audio').play(); musicPlayed = true;}});</script></body></html>
